<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="运动轨迹效果展示：室内与室外、小尺度与长距离，实景视频与轨迹动态对照。">
  <title>迹 · 运动轨迹效果展示</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="data.js" defer></script>
  <script src="gallery.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#small">跳到效果展示</a>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="迹，返回首页"><img src="assets/mark.svg" width="32" height="32" alt=""><strong>迹<span>运动轨迹</span></strong></a>
    <nav aria-label="页面导航"><a href="#small">小尺度</a><a href="#large">大尺度</a><a href="#gallery">轨迹画廊</a><a href="#vivo">VIVO 实测</a></nav>

  </header>
  <main id="top">
    <section class="hero wrap" aria-labelledby="hero-title">
      <div class="hero-heading">
        <h1 id="hero-title">运动手表<span class="hero-accent">轨迹实测</span></h1>
      </div>
      <div class="hero-stage">
        <div class="stage-heading"><span class="live-label"><i></i> 精选现场</span><div id="hero-tabs" class="segmented" aria-label="精选场景"></div></div>
        <div id="hero-player"></div>
      </div>
    </section>

    <section id="small" class="section wrap" aria-labelledby="small-title">
      <div class="section-heading"><h2 id="small-title">小尺度行走</h2></div>
      <div class="small-grid" id="small-grid"></div>
      <p class="section-note">视频使用参考轨迹对齐展示坐标。</p>
    </section>

    <section id="large" class="section large-section" aria-labelledby="large-title"><div class="wrap">
      <div class="section-heading"><h2 id="large-title">长距离路线</h2></div>
      <div class="large-tabs" id="large-tabs" aria-label="大尺度场景"></div>
      <div class="large-stage"><div class="stage-heading"><div><h3 id="large-name"></h3></div><span id="large-badge" class="pill"></span></div><div id="large-player"></div></div>
      <div class="section-footer"><a id="large-original" target="_blank" rel="noopener"></a><a href="#gallery" class="text-link">更多轨迹对照 <span>↗</span></a></div>
    </div></section>

    <section id="gallery" class="section wrap" aria-labelledby="gallery-title">
      <div class="section-heading"><h2 id="gallery-title">轨迹画廊</h2></div>
      <div class="gallery-toolbar"><div class="filter-row" id="gallery-filters" aria-label="筛选轨迹"></div><label class="animation-toggle">动态播放 <input type="checkbox" id="gallery-animation" checked><span aria-hidden="true"></span></label></div>
      <div class="gallery-layout">
        <aside class="gallery-sidebar"><h3>浏览场景</h3><label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="gallery-search" type="search" placeholder="搜索场景名称" aria-label="搜索轨迹场景"></label><div id="gallery-list" class="gallery-list" aria-label="场景列表"></div><div class="list-footer"><span id="gallery-count"></span></div></aside>
        <div class="gallery-main"><div class="gallery-caption"><div><span id="gallery-category" class="eyebrow"></span><h3 id="gallery-name"></h3></div><div class="step-buttons"><button id="gallery-mode" aria-pressed="false">看视频</button><button id="gallery-prev" aria-label="上一条轨迹">← 上一个</button><button id="gallery-next" aria-label="下一条轨迹">下一个 →</button></div></div><div id="gallery-player"></div><p id="gallery-note" class="section-note"></p></div>
      </div>
    </section>

    <section id="vivo" class="section vivo-section" aria-labelledby="vivo-title"><div class="wrap">
      <div class="section-heading"><h2 id="vivo-title">VIVO 无真值实测</h2><span class="vivo-total">31<span> 个场景</span></span></div>
      <div class="vivo-workspace"><div class="vivo-stage"><div class="stage-heading"><span id="vivo-name">场景 A01</span><span class="pill neutral">无真值</span></div><div id="vivo-player"></div></div><aside class="vivo-sidebar"><div class="vivo-sidebar-heading"><h3>选择场景</h3><span id="vivo-count">全部 31 组</span></div><div id="vivo-filters" class="filter-row" aria-label="筛选 VIVO 分组"></div><div id="vivo-list" class="vivo-list" aria-label="VIVO 场景列表"></div><div class="vivo-bottom"><button id="vivo-prev" aria-label="上一个 VIVO 场景">← 上一个</button><button id="vivo-next" aria-label="下一个 VIVO 场景">下一个 →</button></div></aside></div>
      <p class="section-note">31 组 VIVO 测试记录，使用冻结模型仅凭手表 IMU 推理。采样中断的片段各自从局部原点显示。</p>
    </div></section>
  </main>
  <footer class="site-footer wrap"><a class="brand" href="#top"><img src="assets/mark.svg" width="28" height="28" alt=""><strong>迹<span>运动轨迹</span></strong></a><a class="back-top" href="#top">回到顶部 ↑</a></footer>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">请启用浏览器脚本以切换视频。所有素材均保存在本地“assets”目录。</p></noscript>
</body>
</html>
